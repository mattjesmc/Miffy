plugins {
    // Loom's plugin id changed in 26.1+: net.fabricmc.fabric-loom (was fabric-loom)
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    // The MCP Toolkit's shared conventions: Minecraft/loader/Fabric-API versions, the Java level,
    // the repositories, fabric.mod.json version expansion, the toolkit dev bridge on the runtime
    // classpath, and the tasks scaffold / checkAssets / toolkitInit. Must come AFTER Loom: it
    // configures things Loom creates. See mcmodding/gradle-conventions/.
    id 'com.mattmc.mcmod' version '0.7.0'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    // Custom entities need client-only renderer/model code. Split source sets keep
    // client classes (src/client) out of the server jar and give us a `client` entrypoint.
    splitEnvironmentSourceSets()

    mods {
        "nijntje" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        server {
            // Its own directory: the gate's tier 2 (tools/gate.py) boots a dedicated server while a
            // dev client is open, and sharing `run/` means the client's open latest.log handle
            // breaks the server run. `-PserverDir=<dir>` picks another for a second server: two
            // cannot share one, the world holds a session lock and the loser dies on it.
            runDir project.hasProperty('serverDir') ? project.serverDir : 'run-server'
        }
    }
}

dependencies {
    // Minecraft and fabric-loader come from the com.mattmc.mcmod convention plugin. fabric-api is
    // per-mod: not every mod in this workspace wants it.
    implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"

    // The test harness (src/test). JUnit is build-time only and ships in nothing.
    // fabric-loader-junit runs the tests under Knot with mixins applied: registering into
    // BuiltInRegistries goes through Fabric's mixins, so the registry classes cannot even
    // initialise in a bare JVM. GameBootstrap in src/test says what is and is not booted.
    testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "net.fabricmc:fabric-loader-junit:${loaderVersion}"
}

tasks.named('test') {
    useJUnitPlatform()
    // The tests read the shipped files (src/main/resources) by path, so they run from the
    // project root; nothing in src/client is on this classpath by construction
    // (splitEnvironmentSourceSets), which keeps "the server half has no client code" testable.
    workingDir = projectDir
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}



jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}
