# modpage.yml -- the single source of truth for this mod's pages.
# Build with:  modpage build          (README.md + dist/modrinth.md + dist/curseforge.md)
# List the shared skeleton with:  modpage sections
#
# The generator is https://github.com/mattjesmc/ModPageConstructor. Run `modpage build` after
# editing this file or CHANGELOG.md and commit the result; `gradlew build` (modpageCheck) fails
# while a page is stale, and .github/workflows/modpage.yml rebuilds the pages on every push to
# main and on every v* tag.

modpage: "0.4"

name: Nijntje
slug: nijntje
tagline: A tamable bunny that grows into a rideable, armoured battle companion - and brings a puppy.
authors: [mattjesmc]
license: MIT

assets:
  dir: assets
  banner_dir: banners
  base_url: https://raw.githubusercontent.com/mattjesmc/Miffy/main/

links:
  github: https://github.com/mattjesmc/Miffy
  issues: https://github.com/mattjesmc/Miffy/issues

minecraft:
  versions: ["26.2"]
  loaders: [Fabric]
  environment: Client & Server

badges:
  style: for-the-badge
  color: f0a830

header:
  width: 720
  section_banner_width: 480

toc:
  title: Contents
  style: list
  skip: [license]

generators:
  # Every release CHANGELOG.md describes, newest first.
  releases:
    use: changelog.file
    limit: 5

  # Every screenshot in assets/gallery/, captioned from its file name.
  screenshots:
    use: files.glob
    pattern: "gallery/*.png"

sections:
  about: |
    **Nijntje** adds a small white bunny to the overworld. Tame one with a carrot and it
    follows you around like a wolf would; keep feeding it and it grows - through four sizes,
    from a baby you could hold in one hand to a bunny big enough to saddle and ride into a fight.
    A fully grown Nijntje brings a friend: **Snuffy**, a little brown puppy who guards her.

    It is one bunny, one puppy, one piece of armour and one spawn egg. No config, no world data
    to migrate, nothing else in the game changes.

    > An unofficial fan project. Nijntje (Miffy) and Snuffie were created by Dick Bruna and belong
    > to Mercis bv; this mod is not affiliated with, endorsed by, or associated with them, or with
    > Mojang or Microsoft. See *License* below.

  features:
    items:
      - title: Tame with a carrot
        description: >-
          Wild Nijntje spawn in small groups across overworld grassland. Hold out a carrot;
          roughly one in three lands, like a bone on a wolf. Sneak + right-click tells a tame
          bunny to sit or stand.
      - title: Care makes her grow
        description: >-
          Feeding counts toward growth once a minute - a carrot is a meal, a golden carrot a big
          one, a dandelion a snack - and a healthy bunny earns a little more each day just for
          being looked after. About thirty carrots of steady care take her from Baby to Grown.
          Neglect her for three days and she starts to shrink again.
      - title: Four sizes, four stat lines
        description: >-
          Baby, Young, Adult and Grown each scale the model and hitbox and add health, attack,
          speed and armour. Babies and youngsters flee from danger; from Adult on she fights for
          you, attacking whatever you hit and whatever hits you.
      - title: Saddle up
        description: >-
          A Grown Nijntje takes a saddle. Right-click to hop on; steer as you would a horse, and
          hold jump to charge a bunny-sized hop. She sits between the ears.
      - title: Bunny Barding
        description: >-
          A craftable body armour only a Nijntje can wear (+6 armour, +2 toughness). Right-click
          her with it, or drop it in from a dispenser.
      - title: A dress in any colour
        description: >-
          Her dress is orange to begin with. Right-click with any dye to recolour it - all
          sixteen colours, saved with the bunny.
      - title: Saddlebag
        description: >-
          Right-click an unsaddled or sitting Nijntje to open her nine-slot bag, with bars for
          how full she is and how far she is from her next size. Everything in it drops if she
          dies.
      - title: Snuffy
        description: >-
          The moment a tame Nijntje reaches Grown, Snuffy arrives at her side - a puppy who
          follows her, leaps at anything that threatens her, and fights beside her. One per
          bunny, and not for sale.
      - title: Breeding and a voice
        description: >-
          Two tame Nijntje breed on carrots and the kit is born a Baby, tame to the same owner.
          She says hello now and then, with subtitles.

  gallery:
    images: {from: screenshots}

  recipes:
    columns: 3
    scale: 3
    summary: "Show the recipe"
    body: |
      Rendered from the mod's own recipe file at build time.

  dependencies:
    required:
      - name: Fabric Loader
        url: https://fabricmc.net/use/
        version: ">=0.19.3"
      - name: Fabric API
        url: https://modrinth.com/mod/fabric-api
        note: Any build for Minecraft 26.2
      - name: Java
        url: https://adoptium.net/
        version: "25+"

  incompatibilities:
    known: []

  installation: |
    1. Install [Fabric Loader](https://fabricmc.net/use/) for Minecraft 26.2 on Java 25 or newer.
    2. Drop `nijntje-<version>.jar` and [Fabric API](https://modrinth.com/mod/fabric-api) into `mods/`.
    3. Launch. Nijntje spawn in overworld grassland; a spawn egg is in the **Nijntje** creative tab.

    Install on both sides of a server: the bunny and the puppy are entities, the barding is an
    item, and each side needs to know them.

  changelog:
    elements: {from: releases}
    collapsed: true
    summary: "Release history"
    body: |
      Read from `CHANGELOG.md` at build time; the [releases page](https://github.com/mattjesmc/Miffy/releases) carries the jars.

  faq:
    items:
      - q: She won't let me ride her.
        a: >-
          Only a **Grown** Nijntje takes a saddle, and a saddled one still has to be standing:
          sneak + right-click a sitting bunny first. A plain right-click on a bunny that is not
          rideable opens her saddlebag instead.
      - q: Feeding her does nothing.
        a: >-
          It does, once a minute. A meal fed inside the sixty-second cooldown heals her but does
          not count toward growth. The green bar in her saddlebag screen shows the progress.
      - q: Where is Snuffy?
        a: >-
          Snuffy arrives when a **tame** Nijntje grows into her final size, and only once per
          bunny. A Nijntje spawned already Grown never had that moment.
      - q: Can I tame Snuffy, or feed him?
        a: >-
          No. Snuffy belongs to his Nijntje; he follows her, not you, and eats nothing.
      - q: Is there a config file?
        a: There is not. The mod ships one set of numbers, listed in the growth table above.

  credits: |
    Nijntje and Snuffie are Dick Bruna's; this mod is a fan's attempt to bring them into
    Minecraft and claims nothing about them. Models were built in
    [Blockbench](https://www.blockbench.net/) (the sources are in `blockbench_sources/`).
    Built on [Fabric](https://fabricmc.net/) and Fabric API.

  license: |
    The code and build files are under the [MIT License](LICENSE).

    The characters are not: Nijntje (Miffy) and Snuffie were created by Dick Bruna and are the
    property of Mercis bv. The textures and models here that depict them are fan art made for this
    mod; no right in the characters is granted or implied, and this project is not affiliated
    with, endorsed by, sponsored by or otherwise associated with Mercis bv, the estate of Dick
    Bruna or any of their licensees, nor with Mojang AB or Microsoft. The full notice is in
    `LICENSE`.

custom_sections:
  - id: growing-up
    title: Growing up
    after: features
    layout: table
    columns:
      - {field: title, title: Stage}
      - {field: size, title: Size}
      - {field: health, title: Health}
      - {field: attack, title: Attack}
      - {field: armor, title: Armour}
      - {field: does, title: What she does}
    body: |
      Growth is care, not age. Each stage needs a set amount of care to leave; a Grown Nijntje
      stays Grown as long as she is fed.
    elements:
      - {title: Baby,  size: "×0.55", health: "10",  attack: "2", armor: "0", does: "Flees from everything"}
      - {title: Young, size: "×0.85", health: "14",  attack: "3", armor: "0", does: "Still flees; starts to keep up"}
      - {title: Adult, size: "×1.2",  health: "20",  attack: "5", armor: "1", does: "Fights for her owner"}
      - {title: Grown, size: "×1.6",  health: "30",  attack: "8", armor: "3", does: "Rideable with a saddle; Snuffy arrives"}

  - id: development
    title: Development
    after: changelog
    targets: [readme]
    body: |
      JDK 25 and Gradle (wrapper included); Python 3 with Pillow for the test gate's pictures.

      ```
      gradlew build          # compile, JUnit (src/test), checkAssets
      gradlew runClient      # the dev client
      python tools/gate.py   # every check the mod has, tiered by what each needs
      ```

      The gate has four tiers: the asset tree (no game needed), the JVM tests (registries,
      the shipped recipe, tags, lang and the growth ladder), a headless server it boots
      itself (stage attributes, dress colour, barding, the saddle gate, a day of care growing
      a bunny and spawning Snuffy, the saddlebag dropping), and a client tier that renders
      every stage against golden frames. `python tools/gate.py --list` names them all.

      The repository is set up for the MCP Toolkit's live-modding bridge; `AGENTS.md` is
      the session charter an agent reads first. Nothing about the shipped jar depends on it.

footer: "Issues and pull requests are welcome at [github.com/mattjesmc/Miffy](https://github.com/mattjesmc/Miffy)."
