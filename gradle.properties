# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft/loader/Fabric-API/mcp-toolkit versions all come from the com.mattmc.mcmod convention
# plugin (mcmodding/gradle-conventions/). They are deliberately NOT repeated here: that repetition
# across five build roots is what made a Minecraft bump a ten-file edit.
#
# To PIN this repo to something different, set the key here and it wins over the plugin's default:
#   minecraft_version / loader_version / fabric_version / mcptoolkit_version
#
# Pinned: plugin 0.7.0 still defaults the toolkit to 0.128.0, but the workbench's mcp-server (what
# .mcp.json registers) is the 0.156.0 generation. Bump alongside `gradlew build` in mcmodding/mcp-toolkit.
mcptoolkit_version=0.156.0

# THE PORT IS THE PROJECT CONSTANT: what this repo's dev game binds its MCP bridge to, and what
# every MCP registration here (.mcp.json and friends) must name - `gradlew toolkitInit` writes
# them from this one number and corrects one that disagrees. Two dev games on one machine must
# not share a port: the second to boot loses the bind and its session drives the FIRST game.
# `-Pport=<n>` still overrides this for a throwaway run beside a live game.
mcmod.port=25643

# Tests (src/test): the JUnit the workbench's other mods use.
junit_version=5.11.4

# Mod
mod_version=0.1.0
maven_group=com.mattmc.nijntje
archives_base_name=nijntje
